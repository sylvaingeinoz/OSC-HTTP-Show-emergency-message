name: Vérifications
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests du service et de l’installation
        run: python3 -m unittest discover -s tests -v
      - name: Syntaxe des lanceurs
        run: for script in install.sh update.sh pi/*.sh pi/labwc/autostart pi/labwc/shutdown; do bash -n "$script"; done
